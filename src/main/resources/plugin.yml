name: EterModeration
version: '${version}'

main: fr.eternom.eterModeration.Main
api-version: '26.2'
load: POSTWORLD
authors: [ NadTum ]
description: 'Modération du réseau : sanctions selon un barème, appels, alertes, journal du chat, comptes liés, filtre.'
depend: [EterLib]
softdepend: [EterSync, EterHome, EterClan]

commands:
  mod:
    description: Le menu de modération (ou la fiche d'un joueur).
    usage: /mod [joueur]
    aliases: [moderation, sanction]
    permission: eter.mod.use
  appel:
    description: Tes sanctions, et faire appel.
    usage: /appel
    aliases: [appeal]
    permission: eter.mod.appeal
  staff:
    description: Entrer dans le mode staff ou en sortir (invisible, outils).
    usage: /staff
    aliases: [staffmode, sm]
    permission: eter.mod.staff
  report:
    description: Signaler un joueur au staff.
    usage: /report [joueur]
    aliases: [signaler]
    permission: eter.mod.report

# Une permission par action : chaque grade du staff reçoit exactement ce qu'il peut faire (LuckPerms).
permissions:
  eter.mod.appeal:
    description: Voir ses sanctions et faire appel (/appel).
    default: true
  eter.mod.report:
    description: Signaler un joueur (/report).
    default: true
  eter.mod.use:
    description: Ouvrir /mod et la fiche d'un joueur.
    default: op
  eter.mod.warn:
    description: Donner un avertissement.
    default: op
  eter.mod.kick:
    description: Expulser du réseau (il peut revenir tout de suite).
    default: op
  eter.mod.mute:
    description: Rendre muet (chat, messages privés, panneaux, livres, enclume).
    default: op
  eter.mod.ban:
    description: Bannir du réseau, temporairement (définitivement avec eter.mod.permanent).
    default: op
  eter.mod.ban.alts:
    description: Étendre le ban d'un joueur à ses comptes liés.
    default: op
  eter.mod.motive.*:
    description: Utiliser tous les motifs du barème (sinon eter.mod.motive.<motif>, un par un).
    default: op
  eter.mod.free:
    description: Sanction libre, hors barème (durée et raison au choix).
    default: op
  eter.mod.permanent:
    description: 'Sanction définitive (étape « perm » du barème, ou libre), et valider le ban définitif demandé par un autre.'
    default: op
  eter.mod.lift:
    description: Lever une sanction en cours.
    default: op
  eter.mod.change:
    description: Changer la durée d'une sanction en cours.
    default: op
  eter.mod.sanction.staff:
    description: Sanctionner quand même un membre du staff protégé (eter.mod.protected).
    default: op
  eter.mod.appeals:
    description: Traiter les appels.
    default: op
  eter.mod.history:
    description: Historique d'un joueur et dernières sanctions du réseau.
    default: op
  eter.mod.notes:
    description: Lire, écrire et effacer les notes du staff.
    default: op
  eter.mod.chatlog:
    description: Lire les derniers messages d'un joueur (chat et privés).
    default: op
  eter.mod.alts:
    description: Voir les comptes liés (même connexion).
    default: op
  eter.mod.invsee:
    description: 'Voir en lecture seule l''inventaire complet et le coffre de l''Ender d''un joueur, et le comparer à la veille.'
    default: op
  eter.mod.watch:
    description: Mettre un joueur sous surveillance (le staff est prévenu à chacune de ses arrivées).
    default: op
  eter.mod.staff:
    description: 'Mode staff (/staff) : invisible sur tout le réseau, outils ; aller voir un joueur depuis sa fiche.'
    default: op
    children:
      eter.mod.protected: true
  eter.mod.spectate:
    description: Suivre un joueur en spectateur (outil Fiche du mode staff, accroupi).
    default: op
  eter.mod.protected:
    description: 'Staff protégé : ne peut être ni gelé, ni sanctionné sans eter.mod.sanction.staff (donnée avec eter.mod.staff).'
    default: op
  eter.mod.freeze:
    description: Geler un joueur (il ne bouge plus, pour lui parler).
    default: op
  eter.mod.reports:
    description: Traiter les signalements.
    default: op
  eter.mod.alerts:
    description: Recevoir les alertes de modération du réseau.
    default: op
  eter.mod.staffstats:
    description: Les statistiques du staff (/mod).
    default: op
  eter.mod.reload:
    description: '/mod reload : relire le barème et le filtre.'
    default: op
  eter.mod.bypass.filter:
    description: Pas de filtre du chat (ni des panneaux, livres, enclume).
    default: op
  eter.mod.bypass.xray:
    description: Pas d'alerte de minage suspect.
    default: op
  eter.mod.*:
    description: Toutes les permissions de modération.
    default: op
    children:
      eter.mod.appeal: true
      eter.mod.report: true
      eter.mod.staff: true
      eter.mod.spectate: true
      eter.mod.protected: true
      eter.mod.freeze: true
      eter.mod.reports: true
      eter.vanish.see: true
      eter.mod.use: true
      eter.mod.warn: true
      eter.mod.kick: true
      eter.mod.mute: true
      eter.mod.ban: true
      eter.mod.ban.alts: true
      eter.mod.motive.*: true
      eter.mod.free: true
      eter.mod.permanent: true
      eter.mod.lift: true
      eter.mod.change: true
      eter.mod.sanction.staff: true
      eter.mod.appeals: true
      eter.mod.history: true
      eter.mod.notes: true
      eter.mod.chatlog: true
      eter.mod.alts: true
      eter.mod.invsee: true
      eter.mod.watch: true
      eter.mod.alerts: true
      eter.mod.staffstats: true
      eter.mod.reload: true
      eter.mod.bypass.filter: true
      eter.mod.bypass.xray: true
