# Messages d'EterModeration, format MiniMessage : https://docs.advntr.dev/minimessage/format
# Balises de la palette (EterLib/config.yml > language.colors) : <primary> <accent> <info> <error> <success>
# Une clé absente reprend le texte intégré au plugin : tu peux ne garder que les lignes que tu modifies.
# Le préfixe des messages (« Core ») est commun à tous les plugins : EterLib/config.yml > language.prefix.

# Les types de sanction et les motifs du barème (config.yml > motives : un nom par motif).
type:
  kick: "Expulsion"
  warn: "Avertissement"
  mute: "Mute"
  ban: "Ban"
motive-free: "Sanction libre"
motive:
  spam: "Spam / flood"
  insult: "Insultes / irrespect"
  threat: "Menaces"
  advertising: "Publicité"
  inappropriate: "Contenu inapproprié"
  grief: "Grief / vol"
  cheat: "Triche"
  exploit: "Exploitation de bug"
  real-money: "Commerce en argent réel"
  # Ancien motif (prison supprimée) : seulement pour l'historique
  escape: "Évasion (ancien motif)"
  evasion: "Contournement de sanction"
  freeze-logout: "Déconnexion pendant un gel"
length:
  permanent: "définitive"

sanction:
  protected: "<error><accent><player></accent> fait partie du staff : seul un superviseur peut le sanctionner."
  approval-requested: "<info>Ban définitif demandé : c'est un ban de <accent><time></accent> en attendant qu'un autre membre du staff le valide (<accent>/mod</accent>)."
  approval-self: "<error>Un autre membre du staff doit valider ton propre ban définitif."
  approval-done: "<error>Cette demande a déjà été traitée."
  changed: "<success>✔</success> <info>Sanction de <accent><player></accent> : nouvelle durée <accent><time></accent>."
  no-permission: "<error>Tu n'as pas la permission pour cette action."
  reason-required: "<error>Une sanction libre doit avoir une raison."
  bad-duration: "<error>Durée illisible : <accent>30m</accent>, <accent>2h</accent>, <accent>3d</accent>, <accent>2w</accent> ou <accent>perm</accent>."
  self: "<error>Tu ne peux pas te sanctionner toi-même."
  given: "<success>✔</success> <info><accent><type></accent> pour <accent><player></accent> (<motive>)."
  lifted: "<success>✔</success> <info>Sanction de <accent><player></accent> levée."
  already-lifted: "<error>Cette sanction est déjà levée."
  # Icône d'une sanction dans les menus
  name: "<primary><type></primary> <dark_gray>#<id> · <info><player>"
  motive: "<dark_gray>▸ <info>Motif : <accent><motive>"
  reason: "<dark_gray>▸ <info>Raison : <accent><reason>"
  by: "<dark_gray>▸ <info>Par <accent><staff></accent> le <accent><date></accent> <dark_gray>(<server>)"
  date: "<dark_gray>▸ <info>Le <accent><date>"
  length: "<dark_gray>▸ <info>Durée : <accent><time>"
  status-active: "<error>● <info>En cours : encore <accent><time>"
  status-over: "<dark_gray>● Terminée"
  status-lifted: "<success>●</success> <info>Levée par <accent><staff>"

# Ce que reçoit le joueur sanctionné (où qu'il soit sur le réseau)
notify:
  kick: "<error>Tu es expulsé du réseau</error> <info>(<accent><motive></accent>). <reason>"
  changed: "<info>La durée de ta sanction (<type>) a changé : <accent><time></accent>. <dark_gray>Tes sanctions : <click:run_command:'/appeal'><accent>/appeal</accent></click>"
  report-closed: "<info>Ton signalement contre <accent><player></accent> a été traité par le staff. Merci !"
  warn: "<error>Avertissement</error> <info>pour <accent><motive></accent>. <reason> <dark_gray>Le prochain sera plus lourd. Tes sanctions : <click:run_command:'/appeal'><accent>/appeal</accent></click>"
  mute: "<error>Tu es muet pour <accent><time></accent></error> <info>(<accent><motive></accent>). <reason> <dark_gray>Ni chat ni messages privés. Faire appel : <click:run_command:'/appeal'><accent>/appeal</accent></click>"
  ban: "<error>Tu es banni du réseau</error> <info>(<accent><motive></accent>). <reason>"
  lifted: "<success>Ta sanction (<type>) a été levée.</success>"
  appeal-accepted: "<success>Ton appel est accepté : ta sanction est levée.</success> <info>Réponse : <accent><answer>"
  appeal-refused: "<error>Ton appel est refusé.</error> <info>Réponse : <accent><answer>"

mute:
  blocked: "<error>Tu es muet encore <accent><time></accent> (<motive>).</error> <dark_gray>Faire appel : <click:run_command:'/appeal'><accent>/appeal</accent></click>"

# Mots interdits ajoutés en jeu (/mod filter), communs au réseau
filter-admin:
  usage: "<error>/mod filter add <mot> <dark_gray>·</dark_gray> /mod filter remove <mot> <dark_gray>·</dark_gray> /mod filter list"
  added: "<success>✔</success> <info>« <accent><word></accent> » est interdit sur tout le réseau."
  already: "<error>« <accent><word></accent> » est déjà dans la liste."
  removed: "<success>✔</success> <info>« <accent><word></accent> » n'est plus interdit."
  unknown: "<error>« <accent><word></accent> » n'a pas été ajouté en jeu (ceux de config.yml se retirent dans le fichier)."
  empty: "<info>Aucun mot ajouté en jeu <dark_gray>(ceux de config.yml s'appliquent toujours)."
  header: "<info>Mots interdits ajoutés en jeu (<accent><count></accent>) :"
  line: "<dark_gray>▸ <accent><word></accent> <dark_gray>(<staff>)"


filter:
  advert: "<error>Pas de publicité : les adresses de serveurs et de sites sont interdites."
  spam: "<error>Doucement : trop de messages d'un coup."
  repeat: "<error>Inutile de répéter le même message."
  caps: "<error>Moins de majuscules, s'il te plaît."
  word: "<error>Ce message contient un mot interdit."

appeal:
  too-short: "<error>Explique-toi un peu plus (10 caractères au moins)."
  sent: "<success>✔</success> <info>Appel envoyé : le staff te répondra ici, ou dans <accent>/appeal</accent>."
  already: "<error>Tu as déjà fait appel de cette sanction."
  already-answered: "<error>Cet appel a déjà été traité."
  answered-accepted: "<success>✔</success> <info>Appel de <accent><player></accent> accepté : sanction levée."
  answered-refused: "<success>✔</success> <info>Appel de <accent><player></accent> refusé."

# Alertes au staff (eter.mod.alerts), sur tout le réseau
alert:
  approval-needed: "<accent><staff></accent> <info>demande un ban définitif de <accent><player></accent> <dark_gray>(n°<id>)</dark_gray> : à valider dans <click:run_command:'/mod'><accent>/mod</accent></click>"
  approved: "<accent><staff></accent> <info>a validé le ban définitif de <accent><player></accent> demandé par <accent><requester></accent> <dark_gray>(n°<id>)"
  refused: "<accent><staff></accent> <info>a refusé le ban définitif de <accent><player></accent> demandé par <accent><requester></accent> <dark_gray>(n°<id>, le ban temporaire reste)"
  changed: "<accent><staff></accent> <info>a changé la durée de la sanction de <accent><player></accent> (<type>) : <accent><time>"
  freeze-expired: "<info>Le gel de <accent><player></accent> (par <accent><staff></accent>) a pris fin seul après <accent><minutes></accent> min."
  frozen-chat: "<error>[Gel]</error> <accent><player></accent> <dark_gray>»</dark_gray> <white><message>"
  filter-advert: "<accent><player></accent> <info>a écrit une publicité : <dark_gray><message>"
  xray: "<error>Minage suspect</error> <info>: <accent><player></accent> a trouvé <accent><veins></accent> filons rares pour <accent><stone></accent> blocs de pierre en moins d'une heure. <dark_gray>À vérifier (inspecteur, spectateur)."
  watch-join: "<info>Joueur surveillé connecté : <accent><player></accent> <dark_gray>(par <staff> : <reason>)"
  alt-of-banned: "<error>Compte lié à un banni</error> <info>: <accent><player></accent> partage une connexion avec <accent><alts></accent>. <dark_gray>Contournement possible."
  prefix: "<error>[Mod]</error> "
  report: "<info><accent><player></accent> signale <accent><target></accent> : <reason> <dark_gray><text></dark_gray> <click:run_command:'/mod'><accent>/mod</accent></click>"
  frozen: "<accent><staff></accent> <info>a gelé <accent><player>"
  unfrozen: "<accent><staff></accent> <info>a dégelé <accent><player>"
  frozen-quit: "<error><accent><player></accent> s'est déconnecté en étant gelé !"
  freeze-exempt: "<accent><staff></accent> <info>a voulu geler <accent><player></accent>, membre du staff : gel annulé."
  staff-on: "<accent><staff></accent> <info>passe en mode staff"
  staff-off: "<accent><staff></accent> <info>quitte le mode staff"
  given: "<accent><staff></accent> <info>→ <accent><player></accent> : <type> <time> <dark_gray>(<motive>) <reason>"
  lifted: "<accent><staff></accent> <info>a levé : <accent><player></accent> <dark_gray>(<type>)"
  filter: "<info>Mot interdit de <accent><player></accent> : <dark_gray><message>"
  appeal: "<info>Nouvel appel de <accent><player></accent> <dark_gray>(<type>)</dark_gray> : <click:run_command:'/mod'><accent>/mod</accent></click>"
  appeal-accepted: "<accent><staff></accent> <info>a accepté l'appel de <accent><player>"
  appeal-refused: "<accent><staff></accent> <info>a refusé l'appel de <accent><player>"

chatlog:
