  title: "<primary>Reports <dark_gray>(<count>)"
  name: "<accent><player>"
  reason: "<dark_gray>▸ <info>Reason: <accent><reason>"
  details: "<dark_gray>▸ <info>“<text>”"
  by: "<dark_gray>▸ <info>By <accent><player></accent> on <accent><date></accent> <dark_gray>(<server>)"
  click: "<dark_gray>▸ <info>Left: go to them · right: valid · shift right: false · shift left: profile · Q: take it · 1-9: evidence"
  empty: "<success>No report"

# What the player sees when joining
notice:
  returning: "<info>Welcome back. Your ban is over: read the rules on the website again so it doesn't happen again."
  warn:
    title: "<error>Warning"
    body: "<info>You received a warning for <accent><motive></accent>. <reason><newline><newline>The next one will be heavier. Your sanctions: <accent>/appeal</accent>"
    accept: "I understand"
    later: "Later"

# Container log (staff mode lens, sneaking)
container-log:
  header: "<info>Container <accent><x> <y> <z></accent>:"
  empty: "<dark_gray>▸ <info>Nothing taken or put in the last <accent><days></accent> days."
  line: "<dark_gray>▸ <accent><player></accent> <changes> <dark_gray>(<ago>)"

# Read-only copies
chest-view:
  title: "<primary>Container <dark_gray>(<x> <y> <z>) · read only"
view:
  ender: "<primary><player>'s ender chest <dark_gray>· read only"
  inventory: "<primary><player>'s inventory <dark_gray>· read only"
  none: "<error>No save for <accent><player></accent>."

# Compare the inventory with yesterday
compare:
  none: "<error>No snapshot at least one day old for <accent><player></accent> yet."
  header: "<info>Contents of <accent><player></accent> compared to <accent><days></accent> d ago:"
  same: "<dark_gray>▸ <info>Nothing changed."
  more: "<dark_gray>▸ <success>+<amount></success> <item>"
  less: "<dark_gray>▸ <error>-<amount></error> <item>"

# Watch list (player profile)
watch:
  on: "<success>✔</success> <info><accent><player></accent> is now watched."
  off: "<success>✔</success> <info><accent><player></accent> is no longer watched."
  note: "Watched: <reason>"

# Evidence (sanctions, reports)
evidence:
  empty: "<error>No evidence attached."
  header: "<info>Evidence <dark_gray>(<player>)</dark_gray>:"
  line: "<dark_gray>▸ <white><line>"

# Permanent bans to approve
pending:
  title: "<primary>Bans to approve <dark_gray>(<count>)"
  requested: "<dark_gray>▸ <info>Requested by <accent><staff></accent> on <accent><date>"
  click: "<dark_gray>▸ <info>Left click: approve · right: refuse · 1-9: evidence"
  empty: "<success>No ban to approve."

# Staff statistics (30 days)
staff-stats:
  header: "<info>The staff, last 30 days:"
  empty: "<info>No staff action in the last 30 days."
  line: "<dark_gray>▸ <accent><staff></accent> <dark_gray>: <info><detail>"
staff-action:
  sanction: "sanctions"
  lift: "lifted"
  change: "lengths changed"
  freeze: "freezes"
  unfreeze: "unfreezes"
  invsee: "inventories seen"
  chest: "containers seen"
  teleport: "teleports"
  staff_mode: "staff mode"
  spectate: "spectating"
  report: "reports handled"
  appeal: "appeals handled"

reload:
  done: "<success>✔</success> <info>Motives and filter reloaded (config.yml)."
