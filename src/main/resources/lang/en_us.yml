  approved: "<accent><staff></accent> <info>approved the permanent ban of <accent><player></accent> requested by <accent><requester></accent> <dark_gray>(#<id>)"
  refused: "<accent><staff></accent> <info>refused the permanent ban of <accent><player></accent> requested by <accent><requester></accent> <dark_gray>(#<id>, the temporary ban stays)"
  changed: "<accent><staff></accent> <info>changed the length of <accent><player></accent>'s sanction (<type>): <accent><time>"
  freeze-expired: "<info>The freeze of <accent><player></accent> (by <accent><staff></accent>) ended on its own after <accent><minutes></accent> min."
  frozen-chat: "<error>[Frozen]</error> <accent><player></accent> <dark_gray>»</dark_gray> <white><message>"
  filter-advert: "<accent><player></accent> <info>wrote an advert: <dark_gray><message>"
  xray: "<error>Suspicious mining</error><info>: <accent><player></accent> found <accent><veins></accent> rare veins for <accent><stone></accent> stone blocks in less than an hour. <dark_gray>To check (inspector, spectator)."
  watch-join: "<info>Watched player joined: <accent><player></accent> <dark_gray>(by <staff>: <reason>)"
  alt-of-banned: "<error>Account linked to a banned player</error><info>: <accent><player></accent> shares a connection with <accent><alts></accent>. <dark_gray>Possible ban evasion."
  prefix: "<error>[Mod]</error> "
  report: "<info><accent><player></accent> reports <accent><target></accent>: <reason> <dark_gray><text></dark_gray> <click:run_command:'/mod'><accent>/mod</accent></click>"
  frozen: "<accent><staff></accent> <info>froze <accent><player>"
  unfrozen: "<accent><staff></accent> <info>unfroze <accent><player>"
  frozen-quit: "<error><accent><player></accent> logged out while frozen!"
  freeze-exempt: "<accent><staff></accent> <info>tried to freeze <accent><player></accent>, a staff member: freeze cancelled."
  staff-on: "<accent><staff></accent> <info>enters staff mode"
  staff-off: "<accent><staff></accent> <info>leaves staff mode"
  given: "<accent><staff></accent> <info>→ <accent><player></accent>: <type> <time> <dark_gray>(<motive>) <reason>"
  lifted: "<accent><staff></accent> <info>lifted: <accent><player></accent> <dark_gray>(<type>)"
  filter: "<info>Forbidden word from <accent><player></accent>: <dark_gray><message>"
  appeal: "<info>New appeal from <accent><player></accent> <dark_gray>(<type>)</dark_gray>: <click:run_command:'/mod'><accent>/mod</accent></click>"
  appeal-accepted: "<accent><staff></accent> <info>accepted the appeal of <accent><player>"
  appeal-refused: "<accent><staff></accent> <info>refused the appeal of <accent><player>"

chatlog:
  empty: "<info>No message kept from <accent><player></accent>."
  header: "<info>Last messages of <accent><player></accent>:"
  line: "<dark_gray><date> [<server>]</dark_gray> <info><message>"

