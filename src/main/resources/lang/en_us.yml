dialogs:
  watch:
    title: "<primary>Watch <player>"
    body: "<info>The staff will be told each time they join the network. Why?"
    label: "Reason"
    button: "Watch"
  change:
    title: "<primary>Sanction length"
    body: "<info><type> #<id> of <accent><player></accent>: its new total length, from when it was given (30m, 2h, 3d, 2w or perm)."
    label: "Length"
    button: "Change"
  report-who:
    title: "<primary>Report a player"
    body: "<info>Their name. A false report can be sanctioned."
    label: "Name"
    button: "Continue"
  report:
    title: "<primary>Report <player>"
    body: "<info>Reason: <accent><reason></accent><newline><dark_gray>A detail helps the staff (when, where, what). Optional."
    label: "Detail (optional)"
    button: "Report"
  search:
    title: "<primary>Find a player"
    body: "<info>Their name (online or not, across the network)."
    label: "Name"
    button: "Open profile"
  give:
    title: "<primary><type> for <player>"
    body: "<info>Motive: <accent><motive></accent><newline>Penalty: <accent><type> <time></accent><newline><dark_gray>The reason is optional (detail, proof)."
    label: "Reason (optional)"
    button: "Sanction"
  free:
    title: "<primary>Free <type> for <player>"
    body: "<info>Outside the scale. Length: <accent>30m</accent>, <accent>2h</accent>, <accent>3d</accent>, <accent>2w</accent> or <accent>perm</accent>."
    duration: "Length"
    reason: "Reason"
    button: "Sanction"
  note:
    title: "<primary>Note on <player>"
    body: "<info>Visible to staff only."
    label: "Note"
    button: "Add"
  accept:
    title: "<primary>Accept <player>'s appeal"
    body: "<info>The sanction (<accent><type></accent>) will be lifted. A word for the player?"
    label: "Answer"
    button: "Accept"
  refuse:
    title: "<primary>Refuse <player>'s appeal"
    body: "<info>The sanction (<accent><type></accent>) stays. Explain why to the player."
    label: "Answer"
    button: "Refuse"
  appeal:
    title: "<primary>Appeal"
    body: "<info>Sanction: <accent><type></accent><newline>Calmly explain why it is unfair or too heavy. <dark_gray>Only one appeal per sanction."
    label: "Your appeal"
    button: "Send"

confirm:
  approve:
    title: "<primary>Approve the permanent ban"
    body: "<info>Ban of <accent><player></accent> (#<id>), requested by <accent><staff></accent>: it becomes permanent."
    button: "Approve"
  refuse:
    title: "<primary>Refuse the permanent ban"
