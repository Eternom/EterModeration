# ============================================================
#  EterModeration : la modération du réseau
# ============================================================
#
#  À installer sur TOUS les serveurs Paper, avec EterVelocityModeration sur le proxy (c'est lui qui refuse les
#  bannis). Les sanctions sont dans la base commune : une sanction donnée sur
#  un serveur vaut partout. Tout se fait dans /mod (staff) et /appeal (joueurs).
#  Une permission par action (voir le README) : chaque grade du staff reçoit seulement ce qu'il peut faire.
#  Les textes (noms des motifs compris) sont dans lang/. Aussi : /staff (mode staff), /report (signalements). Toute modification nécessite un redémarrage du serveur.

# Le barème : chaque motif a ses étapes, de la première fois à la récidive ; au-delà de la dernière, la dernière
# se répète. Une étape : « warn », « mute 10m », « ban 3d », « ban perm » (s, m, h, d, w ; perm = définitive).
# Une sanction levée (erreur, appel accepté) ne compte pas pour la récidive.
# Utiliser un motif : eter.mod.motive.<motif> ET la permission du type de l'étape (eter.mod.mute...).
# Nom affiché : lang/<langue>.yml > motive.<motif>. icon : l'objet dans le menu.
# Pas de prison : un ban empêche de jouer du tout. Le chat se règle d'abord par le mute, le ban vient après.
motives:
  spam:
    icon: PAPER
    steps: [warn, mute 10m, mute 1h, mute 1d]
  insult:
    icon: BLAZE_POWDER
    steps: [warn, mute 1h, mute 1d, mute 7d, ban 3d]
  threat:
    icon: SKELETON_SKULL
    steps: [mute 1d, mute 7d, ban 7d]
  advertising:
    icon: OAK_SIGN
    steps: [mute 1d, mute 7d, ban 7d]
  # Pseudo, skin, construction : un mute n'y change rien.
  inappropriate:
    icon: NAME_TAG
    steps: [warn, ban 1d, ban 7d]
  grief:
    icon: FLINT_AND_STEEL
    steps: [ban 1d, ban 7d, ban 30d, ban perm]
  cheat:
    icon: DIAMOND_PICKAXE
    steps: [ban 7d, ban 30d, ban perm]
  exploit:
    icon: COMMAND_BLOCK
    steps: [ban 3d, ban 14d, ban perm]
  # Vendre ou acheter avec de l'argent réel entre joueurs (objets, argent, services, comptes). Seule la boutique officielle vend.
  real-money:
    icon: GOLD_INGOT
    steps: [ban 7d, ban 30d, ban perm]
  # Revenir avec un autre compte pendant un ban.
  evasion:
    icon: PLAYER_HEAD
    steps: [ban perm]
  # Se déconnecter pendant un gel (vérification de triche refusée) : donnée automatiquement (freeze.quit-motive).
  freeze-logout:
    icon: PACKED_ICE
    steps: [ban 7d, ban 30d, ban perm]

# Récidive : une sanction plus vieille que ce nombre de mois ne compte plus (un vieux casier s'efface). 0 = toujours.
recidivism-months: 6

# Preuves : pour ces motifs (barème ou filtre), les derniers messages du joueur sont joints à la sanction (fiche >
# historique, touche 1-9).
evidence:
  motives: [spam, insult, threat, advertising]
  lines: 10

# Un ban définitif n'est définitif qu'une fois validé par un second membre du staff (eter.mod.permanent, /mod > Bans à
# valider) ; d'ici là, c'est un ban de « interim ». false = définitif tout de suite.
permanent-approval:
  enabled: true
  interim: 7d

# Le gel (freeze).
freeze:
  # Un gel prend fin seul au bout de ce nombre de minutes (un oubli du staff ne bloque pas un joueur). 0 = jamais.
  max-minutes: 30
  # Le staff qui gèle est téléporté près du joueur (même sur un autre serveur).
  teleport-staff: true
  # Quitter le réseau pendant un gel : cette sanction du barème (vide = seulement une alerte au staff), après
  # quit-grace-seconds (un changement de serveur ou une petite coupure ne compte pas).
  quit-motive: freeze-logout
  quit-grace-seconds: 15


# Commandes de messages privés : bloquées pour un joueur muet, filtrées (mots interdits) et gardées dans le journal.
private-commands: [msg, tell, w, m, whisper, pm, r, reply]

# Journal du chat (chat et messages privés), consultable par le staff (eter.mod.chatlog).
chat-log:
  # Messages gardés ce nombre de jours, puis effacés.
  days: 30

# Filtre du chat. Dispense : eter.mod.bypass.filter.
filter:
  enabled: true
  spam:
    # Plus de max-messages en seconds secondes : bloqué.
    max-messages: 4
    seconds: 6
    # Le même message deux fois de suite : bloqué.
    block-repeat: true
  caps:
    # Au moins min-length lettres et plus de max-percent % de majuscules : bloqué.
    min-length: 8
    max-percent: 70
  # Mots interdits, cherchés en mot entier (sans accents, chiffres remis en lettres : « c0nn4rd » = « connard »).
  # Un groupe de mots est accepté (« nique ta mere »). Chat et messages privés.
  words: [connard, connasse, salope, pute, encule, fdp, ntm, nique ta mere, fils de pute, motherfucker, fuck you, bitch]
  # Un mot interdit : message bloqué et cette sanction du barème tout de suite (vide = seulement bloqué).
  word-motive: insult
  # Spam, répétition, majuscules : message bloqué ; au strikes-ième en strikes-minutes minutes, cette sanction.
  spam-motive: spam
  strikes: 3
  strikes-minutes: 10
  # Auteur des sanctions du filtre dans l'historique.
  staff-name: Filter
  # Publicité : une adresse IP ou un nom de domaine (play.serveur.net, serveur.fr...) dans le chat, un message privé, un
  # panneau, un livre ou un nom d'objet. Les adresses de « allowed » sont permises. motive : la sanction (vide = bloqué).
  # Les mots espacés (« c o n n a r d ») sont aussi reconnus.
  adverts:
    enabled: true
    allowed: [etercraft.fr, discord.gg/eternom]
    motive: advertising

# Minage suspect (anti x-ray) : alerte au staff quand un joueur trouve au moins min-veins filons rares (diamant, débris
# antiques) en une heure, à plus de max-ratio filons pour 100 blocs de pierre cassés. Une alerte, jamais une sanction.
xray:
  enabled: true
  min-veins: 6
  max-ratio: 3.0

# Alertes du staff aussi sur un salon Discord : l'adresse d'un webhook (Paramètres du salon > Intégrations > Webhooks).
# Vide = pas de Discord. alerts : lesquelles (clés de lang/ > alert, sans « alert. ») ; vide = toutes.
# Ne mets jamais cette adresse ailleurs que dans ce fichier : elle permet d'écrire sur le salon.
discord:
  webhook-url: ''
  alerts: [given, lifted, changed, report, appeal, approval-needed, approved, refused, frozen-quit, xray, alt-of-banned, watch-join, filter-advert]

# Signalements (/report) : les motifs proposés (nom affiché : lang/ > report-reason.<motif>) et leur icône.
reports:
  # Un signalement par joueur toutes les ... secondes (sur tout le réseau).
  cooldown-seconds: 60
  # Au-delà de ce nombre de signalements classés « faux » en 30 jours, le joueur ne peut plus signaler. 0 = jamais bloqué.
  false-limit: 3
  # Pour ces motifs, les derniers messages du joueur signalé sont joints au signalement.
  evidence-reasons: [insult, spam]
  reasons:
    cheat: DIAMOND_SWORD
    insult: BLAZE_POWDER
    spam: PAPER
    grief: FLINT_AND_STEEL
    scam: GOLD_INGOT
    bug: COMMAND_BLOCK
    other: BOOK

# Mode staff (/staff) : ni entrée ni sortie sur les serveurs dont le nom commence par l'un de ces préfixes
# (un serveur sans EterSync : l'inventaire rendu y resterait coincé).
staff:
  blocked-servers: []

# Journal des blocs et des coffres (outils Inspecteur et Loupe du mode staff) : gardé ce nombre de jours, dans Redis
# seulement (une clé par chunk et par jour, qui expire d'elle-même). 0 = désactivé.
block-log:
  days: 7

# Le journal des actions du staff (statistiques, contrôle) : gardé ce nombre de jours.
staff-log:
  days: 90

# Bouton Retour des menus des joueurs (/appeal, /report) : la commande lancée ("menu social" : le sous-menu Social de
# /menu), vide pour le menu central, "close" pour fermer.
menus:
  back-command: "menu social"
